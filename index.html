<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chess Chat Bot</title>
    <style>
      /* ── Reset & base ── */
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #1a1a2e;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* ── Header ── */
      header {
        background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 14px;
        box-shadow: 0 2px 12px rgba(0,0,0,0.4);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      header .logo {
        font-size: 28px;
        line-height: 1;
      }
      header h1 {
        margin: 0;
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: #e2c96e;
      }
      header .subtitle {
        font-size: 0.78rem;
        color: #9ab0c8;
        margin-top: 2px;
      }

      /* ── Main layout ── */
      .app-body {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 32px 20px;
      }

      /* ── Board panel ── */
      .board-panel {
        width: min(520px, 100%);
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .panel-card {
        background: #16213e;
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.35);
      }

      /* Chessboard grid */
      .chessboard {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 6px;
        overflow: hidden;
        border: 3px solid #0f3460;
        box-shadow: 0 0 20px rgba(226,201,110,0.15);
      }
      .sq {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: clamp(18px, 4vw, 40px);
        cursor: pointer;
        user-select: none;
        position: relative;
        transition: filter 0.1s;
      }
      .sq:hover { filter: brightness(1.15); }
      .sq.selected { outline: 3px solid #e2c96e; outline-offset: -3px; }
      .sq.highlight { background: rgba(226,201,110,0.45) !important; }
      .sq.light { background: #f0d9b5; }
      .sq.dark  { background: #b58863; }
      .sq .coord {
        position: absolute;
        font-size: 9px;
        font-weight: 600;
        opacity: 0.55;
        bottom: 2px;
        right: 3px;
      }
      .sq.light .coord { color: #b58863; }
      .sq.dark  .coord { color: #f0d9b5; }

      /* Board controls */
      .board-controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .btn {
        flex: 1;
        padding: 9px 14px;
        border: none;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
      }
      .btn:active { transform: scale(0.97); }
      .btn-primary {
        background: #e2c96e;
        color: #1a1a2e;
      }
      .btn-secondary {
        background: #0f3460;
        color: #e0e0e0;
        border: 1px solid #1e5c9e;
      }
      .btn:hover { opacity: 0.88; }

      /* Status bar */
      .status-bar {
        background: #0f3460;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.83rem;
        color: #9ab0c8;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #4caf50;
        flex-shrink: 0;
        box-shadow: 0 0 6px #4caf5080;
      }

      /* ── Responsive: mobile ── */
      @media (max-width: 600px) {
        .app-body { padding: 16px 10px; }
      }
    </style>

    <!-- Watson Assistant Chat integration -->
    <script>
      window.watsonAssistantChatOptions = {
        integrationID: "d96fbca8-9da4-4a67-b36d-00fbe9ed83c9",
        region: "jp-tok",
        serviceInstanceID: "65e8343b-2d75-4314-9e42-e80f850be5b6",
        onLoad: async (instance) => { await instance.render(); }
      };

      setTimeout(function () {
        const t = document.createElement("script");
        t.src =
          "https://web-chat.global.assistant.watson.appdomain.cloud/versions/" +
          (window.watsonAssistantChatOptions.clientVersion || "latest") +
          "/WatsonAssistantChatEntry.js";
        document.head.appendChild(t);
      }, 0);
    </script>
  </head>
  <body>

    <!-- ══ Header ══ -->
    <header>
      <span class="logo">♟️</span>
      <div>
        <h1>Chess Chat Bot</h1>
        <div class="subtitle">Ask me anything about chess — openings, strategy, puzzles &amp; more</div>
      </div>
    </header>

    <!-- ══ App body ══ -->
    <div class="app-body">
      <div class="board-panel">

        <div class="panel-card">
          <div class="chessboard" id="chessboard" aria-label="Chess board"></div>
        </div>

        <div class="panel-card">
          <div class="board-controls">
            <button class="btn btn-primary" id="new-game-btn">♟ New Game</button>
            <button class="btn btn-secondary" id="flip-btn">⇅ Flip Board</button>
          </div>
        </div>

        <div class="status-bar">
          <span class="status-dot"></span>
          <span id="game-status">White to move &mdash; standard starting position</span>
        </div>

      </div>
    </div><!-- /.app-body -->

    <script>
      /* ──────────────────────────────────────────
         Chessboard rendering & interaction
      ────────────────────────────────────────── */
      const INIT_PIECES = {
        a8:'♜', b8:'♞', c8:'♝', d8:'♛', e8:'♚', f8:'♝', g8:'♞', h8:'♜',
        a7:'♟', b7:'♟', c7:'♟', d7:'♟', e7:'♟', f7:'♟', g7:'♟', h7:'♟',
        a2:'♙', b2:'♙', c2:'♙', d2:'♙', e2:'♙', f2:'♙', g2:'♙', h2:'♙',
        a1:'♖', b1:'♘', c1:'♗', d1:'♕', e1:'♔', f1:'♗', g1:'♘', h1:'♖',
      };

      const WHITE_PIECES = new Set(['♙','♖','♘','♗','♕','♔']);
      const BLACK_PIECES = new Set(['♟','♜','♞','♝','♛','♚']);

      let flipped = false;
      let boardState = {};   // square -> piece char
      let selected = null;   // currently selected square key
      let currentTurn = 'white';

      function resetState() {
        boardState = Object.assign({}, INIT_PIECES);
        selected = null;
        currentTurn = 'white';
      }

      function isCurrentPlayer(piece) {
        return currentTurn === 'white' ? WHITE_PIECES.has(piece) : BLACK_PIECES.has(piece);
      }

      function buildBoard(flip) {
        const board = document.getElementById('chessboard');
        board.innerHTML = '';
        const ranks = flip ? [1,2,3,4,5,6,7,8] : [8,7,6,5,4,3,2,1];
        const files = flip ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];

        ranks.forEach((rank, ri) => {
          files.forEach((file, fi) => {
            const key = file + rank;
            const sq = document.createElement('div');
            const isLight = (ri + fi) % 2 === 0;
            sq.className = 'sq ' + (isLight ? 'light' : 'dark');
            sq.dataset.square = key;

            if (boardState[key]) {
              sq.textContent = boardState[key];
            }

            if (ri === 7) {
              const c = document.createElement('span');
              c.className = 'coord';
              c.textContent = file;
              sq.appendChild(c);
            }

            sq.addEventListener('click', () => handleSquareClick(key));
            board.appendChild(sq);
          });
        });
      }

      function renderBoard() {
        buildBoard(flipped);
        if (selected) {
          const el = document.querySelector(`[data-square="${selected}"]`);
          if (el) el.classList.add('selected');
        }
      }

      function handleSquareClick(key) {
        const piece = boardState[key];

        if (selected === null) {
          // Select a piece belonging to the current player
          if (piece && isCurrentPlayer(piece)) {
            selected = key;
            renderBoard();
          }
          return;
        }

        // Deselect if clicking the same square
        if (selected === key) {
          selected = null;
          renderBoard();
          return;
        }

        // Re-select if clicking another own piece
        if (piece && isCurrentPlayer(piece)) {
          selected = key;
          renderBoard();
          return;
        }

        // Move: place piece on target square
        boardState[key] = boardState[selected];
        delete boardState[selected];
        selected = null;
        currentTurn = currentTurn === 'white' ? 'black' : 'white';
        document.getElementById('game-status').textContent =
          (currentTurn === 'white' ? 'White' : 'Black') + ' to move';
        renderBoard();
      }

      resetState();
      buildBoard(false);

      document.getElementById('flip-btn').addEventListener('click', () => {
        flipped = !flipped;
        renderBoard();
      });

      document.getElementById('new-game-btn').addEventListener('click', () => {
        flipped = false;
        resetState();
        buildBoard(false);
        document.getElementById('game-status').textContent =
          'White to move \u2014 standard starting position';
      });
    </script>

  </body>
</html>
